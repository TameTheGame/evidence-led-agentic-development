name: Checks and releases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Lint skills and check links
        run: python tools/check.py

  release:
    name: Publish validated version tag
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Confirm the tag matches VERSION and has notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "$RELEASE_TAG"
          test -f "releases/$RELEASE_TAG.md"

      - name: Publish checked-in release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "ELAD $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" --latest
