name: Checks and releases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The commit checks read every commit reachable from HEAD, not only the newest.
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Lint skills and check links
        run: python tools/check.py

      - name: Test the private-word and AI-attribution checks and push hooks
        run: python tools/test_check.py

      # One script per step: on Windows the step's shell judges only its last command's exit.
      - name: Test the S&box example's spec lint
        run: python examples/sbox/tools/test_spec_lint.py

      - name: Test the S&box example's scene reference check
        run: python examples/sbox/tools/test_scene_refs.py

      - name: Test the S&box example's .meta check
        run: python examples/sbox/tools/test_check_metas.py

      - name: Test the transcript analyzer
        run: python skills/evidence/tools/test_analyze_transcripts.py

  release:
    name: Publish validated version tag
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Confirm the tag matches VERSION and has notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "$RELEASE_TAG"
          test -f "releases/$RELEASE_TAG.md"

      - name: Publish checked-in release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "ELAD $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" --latest
